name: Release ISO

on:
  push:
    tags:
      - 'v[0-9]+.0.0'                # stable major releases (v1.0.0, v2.0.0, ...)
      - 'v0.[0-9]+.[0-9]+'           # pre-1.0 milestones (published as pre-release)
      - 'v[0-9]+.0.0-rc.[0-9]+'      # release candidates (published as pre-release)
  pull_request:
    branches: [ main ]
    paths:
      - 'archiso/**'
      - 'src/rust/**'
      - '.github/workflows/release-iso.yml'
  workflow_dispatch:

# Deny everything by default; each job declares the minimum it needs.
permissions: {}

concurrency:
  group: release-iso-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Verify ref and quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure the tagged commit is reachable from main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point to a commit reachable from main"
            exit 1
          fi

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo npm install -g markdownlint-cli

      - name: Run quality gate
        run: make check

  build:
    name: Build ISO
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
      options: --privileged   # mkarchiso needs mount/chroot capabilities
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed archiso git grub

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in-house Rust tools
        if: hashFiles('src/rust/Cargo.toml') != ''
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed rust
          cargo build --release --locked --manifest-path src/rust/Cargo.toml
          install -D -m 0755 -o root -g root \
            src/rust/target/release/pls archiso/airootfs/usr/local/bin/pls

      - name: Build ISO with mkarchiso
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          if [[ "${REF_TYPE}" == "tag" ]]; then
            IPLS_VERSION="${REF_NAME#v}"
          else
            IPLS_VERSION="dev"
          fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export IPLS_VERSION SOURCE_DATE_EPOCH
          install -d -m 0755 work out
          mkarchiso -v -w work -o out archiso

      - name: Size gate, checksum and package list
        run: |
          set -euo pipefail
          shopt -s nullglob
          isos=(out/*.iso)
          if (( ${#isos[@]} != 1 )); then
            echo "::error::expected exactly one ISO, found ${#isos[@]}"
            exit 1
          fi
          iso="${isos[0]##*/}"
          size="$(stat -c %s -- "out/${iso}")"
          # GitHub Releases accept at most 2 GiB per asset.
          if (( size >= 2147483648 )); then
            echo "::error::${iso} is ${size} bytes, above the 2 GiB release asset limit"
            exit 1
          fi
          ( cd out && sha256sum -- "${iso}" > "${iso}.sha256" )
          if [[ -f work/iso/arch/pkglist.x86_64.txt ]]; then
            cp -- work/iso/arch/pkglist.x86_64.txt "out/${iso%.iso}.pkglist.txt"
          else
            echo "::warning::pkglist.x86_64.txt not found, skipping package manifest"
          fi
          df -h .

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipls-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.pkglist.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # OIDC token for keyless attestation
      attestations: write    # store the provenance attestation
    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipls-iso
          path: dist

      - name: Verify checksum across the job boundary
        working-directory: dist
        run: sha256sum --check --strict -- ./*.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.iso'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          isos=(dist/*.iso)
          if (( ${#isos[@]} != 1 )); then
            echo "::error::expected exactly one ISO in dist/, found ${#isos[@]}"
            exit 1
          fi
          iso="${isos[0]##*/}"
          flags=()
          case "${TAG}" in
            v0.*|*-rc.*) flags+=(--prerelease) ;;
            *) ;;
          esac
          # shellcheck disable=SC2016  # backticks are literal Markdown here
          notes="$(printf 'Verify integrity: `sha256sum -c %s.sha256`\nVerify provenance: `gh attestation verify %s --repo %s`\n' \
            "${iso}" "${iso}" "${GITHUB_REPOSITORY}")"
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "IPLS ${TAG}" \
            --notes "${notes}" \
            "${flags[@]}"
